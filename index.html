    <script>
        tailwind.config = {
            theme: {

                        brand: {
                            50: 'var(--color-brand-50, #fef2f2)',
                            100: 'var(--color-brand-100, #ffe1e1)',
                            500: 'var(--color-brand-500, #ef4444)',
                            600: 'var(--color-brand-600, #dc2626)',
                            700: 'var(--color-brand-700, #b91c1c)',
                        }
                    }
                }
            }
        }

    <style>
        :root {
            --color-brand-50: #fef2f2;

            --color-brand-600: #dc2626;
            --color-brand-700: #b91c1c;
        }
        .theme-burger {
            --color-brand-50: #fffbeb;
            --color-brand-100: #fef3c7;
            --color-brand-500: #f59e0b;
            --color-brand-600: #d97706;
            --color-brand-700: #b45309;
        }
        .theme-green {
            --color-brand-50: #f0fdf4;
            --color-brand-100: #dcfce7;
            --color-brand-500: #22c55e;
            --color-brand-600: #16a34a;
            --color-brand-700: #15803d;
        }
        .theme-dark {
            --color-brand-50: #f5f3ff;
            --color-brand-100: #ede9fe;
            --color-brand-500: #8b5cf6;
            --color-brand-600: #7c3aed;
            --color-brand-700: #6d28d9;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
